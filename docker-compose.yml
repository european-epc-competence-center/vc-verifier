version: '3.7'
services:

  api:
    image: ghcr.io/european-epc-competence-center/vc-verifier/vc_verifier_api
    restart: unless-stopped
    environment:
      - PORT=${API_PORT}
      - VC_REGISTRY=${VC_REGISTRY}
      - GS1_GLOBAL_DID=${GS1_GLOBAL_DID}
    ports:
      - "${API_PORT}:${API_PORT}"


