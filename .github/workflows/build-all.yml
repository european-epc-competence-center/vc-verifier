name: Build API

on:
  push:
    branches: [ 'main' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

jobs:

  build_api:
    name: Build api
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2
      - name: Meta API Image
        id: meta_api
        uses: docker/metadata-action@v3
        with:
          images: ghcr.io/european-epc-competence-center/vc-verifier/vc_verifier_api
          flavor: |
            onlatest=true
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=VC Verifier API
            org.opencontainers.image.description=API container of the verifiable credential verifier service.
            org.opencontainers.image.vendor=EECC
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ./api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

  # Create GitHub Release
  create-release:
    runs-on: ubuntu-latest
    # Only run on version tags
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Headings in this repo are "## X.Y.Z (YYYY-MM-DD)", not "## [X.Y.Z]".
          CHANGELOG_CONTENT=$(awk -v version="$VERSION" '
            BEGIN {
              escaped = version
              gsub(/\./, "\\.", escaped)
              pattern = "^## " escaped " \\("
            }
            $0 ~ pattern { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/^$/d' | head -c 65000)

          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="Release version $VERSION"
          fi

          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG_CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.content }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Release v${{ steps.version.outputs.version }}" \
            --notes "$RELEASE_NOTES"
